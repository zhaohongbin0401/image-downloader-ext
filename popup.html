<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>图片下载助手</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei",system-ui,sans-serif;width:420px;min-height:480px;background:#fafaf7;color:#1f2937;font-size:13px;}
  header{padding:14px 16px 10px;background:#fff;border-bottom:1px solid #eee;}
  header h1{font-size:15px;font-weight:650;color:#0f766e;}
  header p{font-size:11.5px;color:#6b7280;margin-top:3px;}
  .bar{padding:10px 16px;background:#fff;border-bottom:1px solid #eee;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .bar input[type=checkbox]{width:13px;height:13px;}
  .bar label{font-size:12px;cursor:pointer;}
  .bar .count{font-size:12px;color:#0f766e;font-weight:600;margin-left:auto;}
  main{max-height:440px;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#fafaf7;}
  .item{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:1;background:#e5e7eb;cursor:pointer;border:2px solid transparent;transition:border-color .15s,transform .1s;}
  .item:hover{border-color:#0f766e;transform:scale(1.03);z-index:1;}
  .item img{width:100%;height:100%;object-fit:cover;display:block;}
  .item.selected{border-color:#0f766e;background:#e6f3f1;}
  .item.selected::after{content:'✓';position:absolute;top:3px;right:3px;background:#0f766e;color:#fff;width:18px;height:18px;border-radius:50%;font-size:12px;display:grid;place-items:center;font-weight:700;}
  .item .err{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;color:#9ca3af;text-align:center;padding:2px;}
  footer{padding:12px 16px;background:#fff;border-top:1px solid #eee;display:flex;gap:8px;}
  footer button{flex:1;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;}
  footer .primary{background:#0f766e;color:#fff;}
  footer .primary:hover{background:#0d5d56;}
  footer .primary:disabled{opacity:.45;cursor:not-allowed;}
  footer .ghost{background:#f3f4f6;color:#374151;}
  footer .ghost:hover{background:#e5e7eb;}
  .empty{grid-column:1/-1;padding:40px 0;text-align:center;color:#9ca3af;font-size:13px;}
  .loading{grid-column:1/-1;padding:30px 0;text-align:center;color:#6b7280;font-size:13px;}
  .loading::after{content:'…';animation:dots 1s infinite;}
  @keyframes dots{0%{content:'…';}33%{content:'.';}66%{content:'..';}}
  .toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:7px 14px;border-radius:6px;font-size:12px;z-index:99;animation:fade 2.4s forwards;}
  @keyframes fade{0%{opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{opacity:0;}}
</style>
</head>
<body>
<header>
  <h1>图片下载助手</h1>
  <p>自动扫描当前页面所有图片，可预览、勾选、批量下载</p>
</header>
<div class="bar">
  <label><input type="checkbox" id="selAll" /> 全选</label>
  <input type="text" id="filter" placeholder="按域名/关键字过滤…" style="flex:1;border:1px solid #e5e7eb;border-radius:6px;padding:5px 9px;font-size:12px;outline:none;" />
  <span class="count" id="count">0 张</span>
</div>
<main id="list"></main>
<footer>
  <button class="ghost" id="refresh">重新扫描</button>
  <button class="primary" id="download" disabled>批量下载</button>
</footer>
<script src="popup.js"></script>
</body>
</html>
